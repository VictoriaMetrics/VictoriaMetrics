- name: self-monitoring lag and hold, non-default job
  interval: 1m
  input_series:
  - series: vmanomaly_start_time_seconds{job="prod-vmanomaly",instance="a"}
    values: 1 _x1450
  metricsql_expr_test:
  - expr: count(ALERTS{alertname="NoSelfMonitoringMetrics",alertstate="firing"}) or
      vector(0)
    eval_time: 19m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NoSelfMonitoringMetrics",alertstate="firing"}) or
      vector(0)
    eval_time: 22m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NoSelfMonitoringMetrics",alertstate="firing"}) or
      vector(0)
    eval_time: 1441m
    exp_samples:
    - labels: '{}'
      value: 0
- name: 'resource and reload job scope: prod-vmanomaly'
  interval: 1m
  input_series:
  - series: process_resident_memory_bytes{job="prod-vmanomaly",instance="a"}
    values: 50x5 90x20
  - series: vmanomaly_available_memory_bytes{job="prod-vmanomaly",instance="a"}
    values: 100x26
  - series: vmanomaly_config_last_reload_successful{job="prod-vmanomaly",instance="a"}
    values: '0x26'
  metricsql_expr_test:
  - expr: count(ALERTS{alertname="TooHighMemoryUsage",alertstate="firing"}) or vector(0)
    eval_time: 12m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="TooHighMemoryUsage",alertstate="firing"}) or vector(0)
    eval_time: 23m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="LastConfigReloadFailed",alertstate="firing"}) or
      vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="LastConfigReloadFailed",alertstate="firing"}) or
      vector(0)
    eval_time: 11m
    exp_samples:
    - labels: '{}'
      value: 1
- name: 'resource and reload job scope: unrelated'
