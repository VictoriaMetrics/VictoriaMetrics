# Run with vmalert-tool unittest -files=deployment/docker/rules/tests/vmanomaly.yml
rule_files:
- ../alerts-vmanomaly.yml
evaluation_interval: 1m
tests:
- name: 'Read: failure-only'
  interval: 1m
  input_series:
  - series: vmanomaly_reader_responses_total{job="prod-vmanomaly",instance="a",url="http://vm",code="500"}
    values: 0+10x15
  metricsql_expr_test:
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
- name: 'Read: healthy'
  interval: 1m
  input_series:
  - series: vmanomaly_reader_responses_total{job="prod-vmanomaly",instance="a",url="http://vm",code="200"}
    values: 0+10x15
  metricsql_expr_test:
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: 'Read: idle'
  interval: 1m
