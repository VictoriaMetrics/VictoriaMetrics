  - series: vmanomaly_reader_responses_total{job="prod-vmanomaly",instance="a",url="http://vm",code="200"}
    values: '0x15'
  - series: vmanomaly_reader_responses_total{job="prod-vmanomaly",instance="a",url="http://vm",code="500"}
    values: '0x15'
  metricsql_expr_test:
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="HighReadErrorRate",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: 'Read: missing'
  interval: 1m
