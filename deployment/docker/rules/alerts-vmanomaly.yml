# This file provides a recommended list of alerts to monitor the health of VictoriaMetrics Anomaly Detection (vmanomaly).
# Note: The alerts below are general recommendations and may require customization,
# including threshold adjustments, to suit the specifics of your setup.

groups:
    # Note - Adjust the `job` filter to match your specific setup.
    # By default, the `job` label for vmanomaly in push-based self-monitoring mode is set to `vmanomaly`.
    # However, this can be overridden using additional labels. For further details, refer to the example here:
    # https://docs.victoriametrics.com/anomaly-detection/components/monitoring/?highlight=extra_labels#monitoring-section-config-example
  - name: vmanomaly-health
    rules:
      - alert: TooManyRestarts
        expr: changes(process_start_time_seconds{job=~".*vmanomaly.*"}[15m]) > 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} too many restarts (instance {{ $labels.instance }})"
          description: |
            Job {{ $labels.job }} (instance {{ $labels.instance }}) has restarted more than twice in the last 15 minutes.
            It might be crashlooping. Please check the logs for more details.
            This detects restarts only while the job and instance labels remain unchanged; use orchestrator restart metrics for replaced containers.

      # Requires pull-based self-monitoring through vmagent or another scraper.
      - alert: ServiceDown
        expr: up{job=~".*vmanomaly.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down on {{ $labels.instance }}"
          description: "Scrapes of {{ $labels.instance }} of job {{ $labels.job }} have failed for more than 5m. Targets removed from service discovery are not detected by this rule."

      - alert: SchedulerWorkerDown
        expr: >
          (vmanomaly_scheduler_alive{job=~".*vmanomaly.*"} == 0)
          and on (job, instance, scheduler_alias, preset)
          (sum(vmanomaly_scheduler_restarts_total{job=~".*vmanomaly.*"})
          by (job, instance, scheduler_alias, preset) > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scheduler {{ $labels.scheduler_alias }} is down in {{ $labels.job }} ({{ $labels.instance }})"
          description: |
            Periodic scheduler {{ $labels.scheduler_alias }} from preset {{ $labels.preset }} has remained down for more than 2 minutes
            after entering automatic recovery. The restart policy may be exhausted.
            Check vmanomaly logs and the vmanomaly_scheduler_restarts_total metric for restart failures.

      - alert: FrequentSchedulerRestarts
        expr: >
          sum(increase(vmanomaly_scheduler_restarts_total{job=~".*vmanomaly.*"}[15m]))
          by (job, instance, scheduler_alias, preset) > 2
        labels:
          severity: warning
        annotations:
          summary: "Scheduler {{ $labels.scheduler_alias }} is restarting frequently in {{ $labels.job }} ({{ $labels.instance }})"
          description: |
            Scheduler {{ $labels.scheduler_alias }} from preset {{ $labels.preset }} had more than two restart attempts
            during the last 15 minutes. The service may be self-healing, but repeated restarts indicate an unstable
            scheduler, configuration, datasource, or runtime dependency. Check vmanomaly logs for the original failure.

      # Set the limit above the expected scrape or push interval, allowing for jitter.
      # For the default 15m push_frequency, raise the 900s limit (e.g. to 1200s),
      # or shorten push_frequency (e.g. to 10m). The 5m alert hold applies separately.
      - alert: NoSelfMonitoringMetrics
        expr: >
          lag(vmanomaly_start_time_seconds{job=~".*vmanomaly.*"}[24h]) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Metrics have not been seen from \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") for {{ $value }} seconds"
          description: >
            No recent self-monitoring sample has arrived. The 15-minute lag threshold plus the 5-minute hold fires after approximately 20 minutes.
            This rule can identify an instance only while its last sample remains within the 24-hour lookback. Check the service, scraper, and remote-write path.

      - alert: ProcessNearFDLimits
        expr: (process_max_fds{job=~".*vmanomaly.*"} - process_open_fds{job=~".*vmanomaly.*"}) < 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Number of free file descriptors is less than 100 for \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") for the last 5m"
          description: |
            Exhausting OS file descriptors limit can cause severe degradation of the process.
            Consider to increase the limit as fast as possible.

      - alert: TooHighCPUUsage
        expr: > 
          sum(rate(process_cpu_seconds_total{job=~".*vmanomaly.*"}[5m])) by (job, instance) /
          sum(vmanomaly_cpu_cores_available{job=~".*vmanomaly.*"}[5m]) by (job, instance) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 90% of CPU is used by \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") during the last 5m"
          description: >
            Too high CPU usage may be a sign of insufficient resources and make process unstable.
            Consider to either increase available CPU resources or decrease the load on the process.

      - alert: TooHighMemoryUsage
        expr: (min_over_time(process_resident_memory_bytes{job=~".*vmanomaly.*"}[10m]) / vmanomaly_available_memory_bytes{job=~".*vmanomaly.*"}) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "It is more than 85% of memory used by \"{{ $labels.job }}\"(\"{{ $labels.instance }}\")"
          description: |
            The minimum RSS over the last 10 minutes exceeds 85% of available memory, and this condition has held for 5 minutes.
            This indicates sustained memory pressure, not a confirmed OOM.
            E.g. it can be caused by high churn rate in your input data.
            Consider to either increase available memory or decrease the load on the process.
        
      - alert: LastConfigReloadFailed
        expr: vmanomaly_config_last_reload_successful{job=~".*vmanomaly.*"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Last configuration reload failed for \"{{ $labels.job }}\"(\"{{ $labels.instance }}\")"
          description: |
            The last configuration reload attempt failed, which may indicate issues with the configuration or the service's
            ability to apply changes. Check the logs for more details and ensure the configuration is valid.
            See more details in the [hot-reload documentation](https://docs.victoriametrics.com/anomaly-detection/components/#hot-reload).

  - name: vmanomaly-issues
    rules:
      - alert: ServiceErrorsDetected
        expr: sum(increase(vmanomaly_model_run_errors_total{job=~".*vmanomaly.*"}[5m])) by (job, instance, stage) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Model Run Errors in \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") stage: {{ $labels.stage }} during the last 5m"
          description: >
            The rolling 5-minute model-error count has remained positive for 5 minutes. An isolated error may not trigger this alert.
            Investigate the logs for more details.
      - alert: SkippedModelRunsDetected
        expr: sum(increase(vmanomaly_model_runs_skipped_total{job=~".*vmanomaly.*"}[5m])) by (job, instance, stage) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Skipped Model Runs in \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") stage: {{ $labels.stage }} during the last 5m"
          description: >
            Skipped runs can be expected during warmup or when no new data arrives; this alert alone does not indicate a service failure. Possible causes include:
              1. No new or valid data is available for the current run.
              2. The presence of new time series that do not have a trained model yet.
              3. No new (or valid) datapoints produced during inference.
            Investigate the logs for more details.
      - alert: HighReadErrorRate
        expr: >
          (
            sum(increase(vmanomaly_reader_responses_total{job=~".*vmanomaly.*", code!~"2.."}[5m])) by (job, instance, url) /
            sum(increase(vmanomaly_reader_responses_total{job=~".*vmanomaly.*"}[5m])) by (job, instance, url)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in read requests for \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") for url: {{ $labels.url }} during the last 5m"
          description: >
            More than 5% of reader responses failed in the rolling 5-minute window, with the condition holding for 5 minutes.
            Check the input data source, server-side constraints, credentials, and network.
            Investigate the logs for more details.
      - alert: HighWriteErrorRate
        expr: >
          (
            sum(increase(vmanomaly_writer_responses_total{job=~".*vmanomaly.*", code!~"2.."}[5m])) by (job, instance, url) /
            sum(increase(vmanomaly_writer_responses_total{job=~".*vmanomaly.*"}[5m])) by (job, instance, url)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in write requests for \"{{ $labels.job }}\"(\"{{ $labels.instance }}\") for url: {{ $labels.url }} during the last 5m"
          description: >
            More than 5% of writer batch outcomes failed after retries in the rolling 5-minute window, with the condition holding for 5 minutes.
            Check the destination, server-side constraints, credentials, and network.
            Investigate the logs for more details.
