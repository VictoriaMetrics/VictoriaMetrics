rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: "start_timestamp as Unix timestamp"
    start_timestamp: 1700000000
    interval: 1m
    input_series:
      - series: 'up{job="vmagent2", instance="localhost:9090"}'
        values: "0x20"

    metricsql_expr_test:
      - expr: time()
        eval_time: 0
        exp_samples:
          - value: 1700000000
      - expr: time()
        eval_time: 10m
        exp_samples:
          - value: 1700000600
      - expr: timestamp(up)
        eval_time: 10m
        exp_samples:
          - labels: '{instance="localhost:9090", job="vmagent2"}'
            value: 1700000600

    alert_rule_test:
      - eval_time: 10m
        groupname: group1
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              job: vmagent2
              severity: page
              instance: localhost:9090
              cluster: prod
            exp_annotations:
              summary: "Instance localhost:9090 down"
              description: "localhost:9090 of job vmagent2 in cluster prod has been down for more than 5 minutes."
              dashboard: "http://grafana:3000/d/dashboard?orgId=1"

  - name: "start_timestamp as RFC3339"
    start_timestamp: "2024-06-01T12:00:00Z"
    interval: 1m
    input_series:
      - series: test
        values: "1+1x10"

    metricsql_expr_test:
      - expr: time()
        eval_time: 5m
        exp_samples:
          - value: 1717243500
      - expr: test
        eval_time: 5m
        exp_samples:
          - labels: test
            value: 6

  - name: "default start time"
    interval: 1m
    input_series:
      - series: test
        values: "1"

    metricsql_expr_test:
      - expr: time()
        eval_time: 0
        exp_samples:
          - value: 946684800
